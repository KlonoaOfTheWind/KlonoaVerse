<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KlonoaVerse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;700&family=Fredoka+One&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #e8f4f0; --surface: #ffffff; --surface2: #f0faf6; --border: #c2e0d8;
      --accent: #2d7d5e; --accent2: #5ba68a; --accent-light: #d4f0e6;
      --text: #1a3a2e; --text2: #4a7a66;
      --yeah: #e05a8a; --yeah-light: #fce8f0;
      --radius: 12px; --radius-sm: 8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    nav { background: var(--accent); padding: 0 1.5rem; display: flex; align-items: center; justify-content: space-between; height: 52px; position: sticky; top: 0; z-index: 100; }
    .nav-logo { font-family: 'Fredoka One', cursive; font-size: 22px; color: #fff; cursor: pointer; }
    .nav-right { display: flex; align-items: center; gap: 12px; }
    .nav-user { font-size: 13px; color: rgba(255,255,255,0.85); cursor: pointer; text-decoration: underline; }
    .btn { font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 700; padding: 6px 14px; border-radius: 20px; border: none; cursor: pointer; transition: opacity 0.15s; }
    .btn:hover { opacity: 0.85; }
    .btn-white { background: #fff; color: var(--accent); }
    .btn-outline { background: transparent; color: #fff; border: 1.5px solid rgba(255,255,255,0.5); }
    .btn-accent { background: var(--accent); color: #fff; }
    .btn-yeah { background: var(--yeah-light); color: var(--yeah); border: 1.5px solid #f0b8cf; font-size: 12px; padding: 4px 10px; }
    .btn-yeah.active { background: var(--yeah); color: #fff; border-color: var(--yeah); }
    .layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 1.25rem; max-width: 960px; margin: 1.25rem auto; padding: 0 1rem; }
    @media (max-width: 640px) { .layout { grid-template-columns: 1fr; } .sidebar { display: none; } }
    .sidebar { display: flex; flex-direction: column; gap: 12px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; }
    .card-title { font-size: 11px; font-weight: 700; color: var(--text2); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 10px; }
    .community-item { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: var(--radius-sm); cursor: pointer; transition: background 0.12s; }
    .community-item:hover, .community-item.active { background: var(--surface2); }
    .community-icon { width: 32px; height: 32px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
    .community-name { font-size: 13px; font-weight: 700; color: var(--text); }
    .profile-card { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .avatar { border-radius: 50%; background: var(--accent-light); color: var(--accent); font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; overflow: hidden; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .main { display: flex; flex-direction: column; gap: 12px; }
    .community-header { background: var(--accent); border-radius: var(--radius); padding: 1rem 1.25rem; }
    .community-header h2 { font-family: 'Fredoka One', cursive; font-size: 20px; color: #fff; }
    .community-header p { font-size: 12px; color: rgba(255,255,255,0.75); margin-top: 2px; }
    .new-post { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; }
    .new-post-row { display: flex; gap: 10px; align-items: flex-start; }
    textarea { font-family: 'Nunito', sans-serif; font-size: 14px; color: var(--text); background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; width: 100%; resize: none; outline: none; transition: border 0.15s; }
    textarea:focus { border-color: var(--accent2); }
    .new-post-actions { display: flex; justify-content: flex-end; margin-top: 8px; }
    .post { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem 1.25rem; animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .post-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .post-user { font-size: 14px; font-weight: 700; color: var(--text); cursor: pointer; }
    .post-user:hover { text-decoration: underline; }
    .post-meta { font-size: 11px; color: var(--text2); }
    .post-body { font-size: 14px; color: var(--text); line-height: 1.65; margin-bottom: 12px; }
    .post-footer { display: flex; align-items: center; gap: 12px; }
    .auth-wrap { max-width: 400px; margin: 3rem auto; padding: 0 1rem; }
    .auth-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 2rem; }
    .auth-title { font-family: 'Fredoka One', cursive; font-size: 28px; color: var(--accent); text-align: center; margin-bottom: 4px; }
    .auth-sub { font-size: 13px; color: var(--text2); text-align: center; margin-bottom: 1.5rem; }
    .field { margin-bottom: 12px; }
    .field label { font-size: 12px; font-weight: 700; color: var(--text2); display: block; margin-bottom: 4px; }
    input[type=text], input[type=email], input[type=password] { font-family: 'Nunito', sans-serif; font-size: 14px; color: var(--text); background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 9px 12px; width: 100%; outline: none; transition: border 0.15s; }
    input:focus { border-color: var(--accent2); }
    .btn-full { width: 100%; padding: 10px; font-size: 15px; border-radius: var(--radius-sm); margin-top: 4px; }
    .auth-switch { font-size: 13px; color: var(--text2); text-align: center; margin-top: 1rem; }
    .auth-switch a { color: var(--accent); cursor: pointer; font-weight: 700; text-decoration: none; }
    .msg { font-size: 12px; padding: 8px 12px; border-radius: var(--radius-sm); margin-bottom: 12px; text-align: center; }
    .msg-error { background: #fce8e8; color: #c0392b; }
    .msg-success { background: var(--accent-light); color: var(--accent); }
    .empty { text-align: center; padding: 3rem 1rem; color: var(--text2); font-size: 14px; }
    .empty-icon { font-size: 40px; margin-bottom: 8px; }
    .loading { text-align: center; padding: 2rem; color: var(--text2); font-size: 14px; }

    /* PROFILE PAGE */
    .profile-page { max-width: 680px; margin: 0 auto; padding: 0 1rem 2rem; }
    .profile-banner { width: 100%; height: 160px; background: linear-gradient(135deg, #2d7d5e, #5ba68a); border-radius: var(--radius) var(--radius) 0 0; overflow: hidden; position: relative; }
    .profile-banner img { width: 100%; height: 100%; object-fit: cover; }
    .profile-banner-edit { position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.5); color: #fff; border: none; border-radius: 20px; padding: 4px 10px; font-size: 11px; cursor: pointer; font-family: 'Nunito', sans-serif; font-weight: 700; }
    .profile-info-card { background: var(--surface); border: 1px solid var(--border); border-radius: 0 0 var(--radius) var(--radius); padding: 0 1.25rem 1.25rem; margin-bottom: 1rem; }
    .profile-avatar-wrap { position: relative; display: inline-block; margin-top: -36px; margin-bottom: 8px; }
    .profile-avatar-edit { position: absolute; bottom: 0; right: 0; background: var(--accent); color: #fff; border: none; border-radius: 50%; width: 22px; height: 22px; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .profile-username { font-family: 'Fredoka One', cursive; font-size: 22px; color: var(--text); }
    .profile-bio { font-size: 13px; color: var(--text2); margin-top: 4px; line-height: 1.5; }
    .profile-actions { margin-top: 12px; display: flex; gap: 8px; }

    /* EDIT PROFILE */
    .edit-wrap { max-width: 500px; margin: 2rem auto; padding: 0 1rem; }
    .upload-area { border: 2px dashed var(--border); border-radius: var(--radius-sm); padding: 1.5rem; text-align: center; cursor: pointer; transition: border 0.15s; background: var(--surface2); }
    .upload-area:hover { border-color: var(--accent2); }
    .upload-area img { max-height: 120px; max-width: 100%; border-radius: var(--radius-sm); margin-bottom: 8px; }
    .upload-label { font-size: 12px; color: var(--text2); }
  </style>
</head>
<body>
<nav>
  <div class="nav-logo" onclick="showHome()">🌀 KlonoaVerse</div>
  <div class="nav-right">
    <span class="nav-user" id="nav-username" onclick="showOwnProfile()"></span>
    <button class="btn btn-outline" id="nav-auth-btn" onclick="handleAuthBtn()">Sign in</button>
  </div>
</nav>
<div id="app"></div>
<script>
  const SUPABASE_URL = 'https://jvxhqzmybeeeanflazuo.supabase.co'
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp2eGhxem15YmVlZWFuZmxhenVvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzOTYxMjIsImV4cCI6MjA5NDk3MjEyMn0.swj3-6nFWPlXjqttBWPEBssv-1TFmJ71xLLnaRlIzSI'

  const { createClient } = supabase
  const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

  const COMMUNITIES = [
    { id: 'klonoa', name: 'Klonoa', icon: '🌀', desc: 'Klonoa games, mods and decompilations', color: '#ede8fa' },
    { id: 'sonic', name: 'Sonic', icon: '💨', desc: 'All things Sonic the Hedgehog', color: '#dceeff' },
    { id: 'retro', name: 'Retro gaming', icon: '🕹️', desc: 'Classic consoles and games', color: '#e8f4d4' },
    { id: 'modding', name: 'Modding', icon: '🔧', desc: 'ROM hacks, mods and tools', color: '#fef3d4' },
    { id: 'general', name: 'General', icon: '💬', desc: 'Anything goes', color: '#fce8f0' },
  ]

  let currentUser = null
  let currentProfile = null
  let currentCommunity = 'klonoa'
  let authMode = 'signin'
  let profileCache = {}

  async function init() {
    const { data: { session } } = await db.auth.getSession()
    currentUser = session?.user ?? null
    if (currentUser) await loadCurrentProfile()
    updateNav()
    renderApp()
  }

  async function loadCurrentProfile() {
    const { data } = await db.from('profiles').select('*').eq('id', currentUser.id).single()
    currentProfile = data
  }

  function getAvatarUrl(profile) {
    if (profile?.avatar_url) return `<img src="${profile.avatar_url}" alt="avatar" />`
    return (profile?.username?.[0] ?? '?').toUpperCase()
  }

  function updateNav() {
    const btn = document.getElementById('nav-auth-btn')
    const userEl = document.getElementById('nav-username')
    if (currentUser) {
      userEl.textContent = currentProfile?.username || currentUser.email?.split('@')[0] || 'User'
      btn.textContent = 'Sign out'
      btn.className = 'btn btn-outline'
    } else {
      userEl.textContent = ''
      btn.textContent = 'Sign in'
      btn.className = 'btn btn-white'
    }
  }

  function handleAuthBtn() {
    if (currentUser) {
      db.auth.signOut().then(() => { currentUser = null; currentProfile = null; profileCache = {}; updateNav(); renderApp() })
    } else {
      renderAuth()
    }
  }

  function showHome() { renderApp() }
  function showOwnProfile() { if (currentUser) renderProfile(currentUser.id) }

  function renderApp() {
    if (currentUser && !currentProfile?.username) { renderUsernameSetup(); return }
    const community = COMMUNITIES.find(c => c.id === currentCommunity)
    document.getElementById('app').innerHTML = `
      <div class="layout">
        <aside class="sidebar">
          <div class="card">
            <div class="card-title">Communities</div>
            ${COMMUNITIES.map(c => `
              <div class="community-item ${c.id === currentCommunity ? 'active' : ''}" onclick="switchCommunity('${c.id}')">
                <div class="community-icon" style="background:${c.color}">${c.icon}</div>
                <div><div class="community-name">${c.name}</div></div>
              </div>
            `).join('')}
          </div>
          ${currentUser ? `
          <div class="card">
            <div class="card-title">Your profile</div>
            <div class="profile-card" onclick="showOwnProfile()">
              <div class="avatar" style="width:38px;height:38px;">${getAvatarUrl(currentProfile)}</div>
              <div>
                <div style="font-size:13px;font-weight:700;">${currentProfile?.username ?? currentUser.email?.split('@')[0]}</div>
                <div style="font-size:11px;color:var(--text2);">View profile</div>
              </div>
            </div>
          </div>` : ''}
        </aside>
        <main class="main">
          <div class="community-header">
            <h2>${community.icon} ${community.name} community</h2>
            <p>${community.desc}</p>
          </div>
          ${currentUser ? `
          <div class="new-post card">
            <div class="new-post-row">
              <div class="avatar" style="width:36px;height:36px;margin-top:2px;">${getAvatarUrl(currentProfile)}</div>
              <textarea id="post-input" rows="3" placeholder="Write a post in ${community.name}..."></textarea>
            </div>
            <div class="new-post-actions"><button class="btn btn-accent" onclick="submitPost()">Post</button></div>
            <div id="post-msg"></div>
          </div>` : `
          <div class="card" style="text-align:center;padding:1rem;">
            <span style="font-size:13px;color:var(--text2);">
              <a href="#" onclick="renderAuth()" style="color:var(--accent);font-weight:700;">Sign in</a> to post
            </span>
          </div>`}
          <div id="posts-list"><div class="loading">Loading posts...</div></div>
        </main>
      </div>
    `
    loadPosts()
  }

  async function loadPosts(containerId = 'posts-list', filterUserId = null) {
    let query = db.from('posts').select('*').order('created_at', { ascending: false }).limit(30)
    if (filterUserId) {
      query = query.eq('user_id', filterUserId)
    } else {
      query = query.eq('community', currentCommunity)
    }
    const { data, error } = await query
    const container = document.getElementById(containerId)
    if (!container) return

    if (error || !data || data.length === 0) {
      container.innerHTML = `<div class="empty"><div class="empty-icon">🌀</div>No posts yet!</div>`
      return
    }

    let yeahMap = {}
    if (currentUser) {
      const ids = data.map(p => p.id)
      const { data: yeahs } = await db.from('yeahs').select('post_id').eq('user_id', currentUser.id).in('post_id', ids)
      yeahs?.forEach(y => { yeahMap[y.post_id] = true })
    }

    const { data: yeahCounts } = await db.from('yeahs').select('post_id')
    const countMap = {}
    yeahCounts?.forEach(y => { countMap[y.post_id] = (countMap[y.post_id] || 0) + 1 })

    const userIds = [...new Set(data.map(p => p.user_id).filter(Boolean))]
    const { data: profiles } = await db.from('profiles').select('id, username, avatar_url').in('id', userIds)
    profiles?.forEach(p => { profileCache[p.id] = p })

    container.innerHTML = data.map(post => {
      const profile = profileCache[post.user_id] || {}
      const username = profile.username || post.user_id?.slice(0, 8) || 'Anonymous'
      const avatarContent = profile.avatar_url
        ? `<img src="${profile.avatar_url}" alt="avatar" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" />`
        : username[0].toUpperCase()
      const date = new Date(post.created_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })
      const yeah = yeahMap[post.id]
      const count = countMap[post.id] || 0
      return `
        <div class="post">
          <div class="post-header">
            <div class="avatar" style="width:36px;height:36px;">${avatarContent}</div>
            <div>
              <div class="post-user" onclick="renderProfile('${post.user_id}')">${username}</div>
              <div class="post-meta">${date} · ${post.community}</div>
            </div>
          </div>
          <div class="post-body">${escapeHtml(post.content)}</div>
          <div class="post-footer">
            <button class="btn btn-yeah ${yeah ? 'active' : ''}" onclick="toggleYeah('${post.id}', ${yeah})">
              Yeah! ${count > 0 ? count : ''}
            </button>
          </div>
        </div>
      `
    }).join('')
  }

  async function renderProfile(userId) {
    document.getElementById('app').innerHTML = `<div class="loading" style="margin-top:3rem;">Loading profile...</div>`
    const { data: profile } = await db.from('profiles').select('*').eq('id', userId).single()
    if (!profile) { document.getElementById('app').innerHTML = `<div class="empty" style="margin-top:3rem;"><div class="empty-icon">😕</div>Profile not found</div>`; return }

    const isOwn = currentUser?.id === userId
    const avatarContent = profile.avatar_url
      ? `<img src="${profile.avatar_url}" alt="avatar" style="width:100%;height:100%;object-fit:cover;" />`
      : (profile.username?.[0] ?? '?').toUpperCase()

    document.getElementById('app').innerHTML = `
      <div class="profile-page">
        <div style="position:relative;">
          <div class="profile-banner">
            ${profile.banner_url ? `<img src="${profile.banner_url}" alt="banner" />` : ''}
            ${isOwn ? `<button class="profile-banner-edit" onclick="renderEditProfile()">✏️ Edit profile</button>` : ''}
          </div>
          <div class="profile-info-card">
            <div class="profile-avatar-wrap">
              <div class="avatar" style="width:72px;height:72px;font-size:28px;border:3px solid #fff;">${avatarContent}</div>
            </div>
            <div class="profile-username">${profile.username ?? 'Unknown'}</div>
            ${profile.bio ? `<div class="profile-bio">${escapeHtml(profile.bio)}</div>` : `<div class="profile-bio" style="color:var(--border);">${isOwn ? 'No bio yet — edit your profile to add one!' : ''}</div>`}
            <div class="profile-actions">
              ${isOwn ? `<button class="btn btn-accent" onclick="renderEditProfile()">Edit profile</button>` : ''}
              <button class="btn btn-outline" style="color:var(--text2);border-color:var(--border);" onclick="showHome()">← Back</button>
            </div>
          </div>
        </div>
        <div style="font-size:13px;font-weight:700;color:var(--text2);margin-bottom:8px;padding:0 4px;">Posts by ${profile.username}</div>
        <div id="profile-posts"><div class="loading">Loading posts...</div></div>
      </div>
    `
    loadPosts('profile-posts', userId)
  }

  function renderEditProfile() {
    document.getElementById('app').innerHTML = `
      <div class="edit-wrap">
        <div class="card">
          <div style="font-family:'Fredoka One',cursive;font-size:22px;color:var(--accent);margin-bottom:1.5rem;">Edit profile</div>
          <div id="edit-msg"></div>

          <div class="field">
            <label>Banner image</label>
            <div class="upload-area" onclick="document.getElementById('banner-input').click()">
              <div id="banner-preview">
                ${currentProfile?.banner_url ? `<img src="${currentProfile.banner_url}" />` : ''}
                <div class="upload-label">Click to upload banner (recommended: 1200x400px)</div>
              </div>
              <input type="file" id="banner-input" accept="image/*" style="display:none" onchange="previewImage('banner-input','banner-preview-img','banner-preview')" />
            </div>
          </div>

          <div class="field">
            <label>Profile picture</label>
            <div class="upload-area" onclick="document.getElementById('avatar-input').click()">
              <div id="avatar-preview">
                ${currentProfile?.avatar_url ? `<img src="${currentProfile.avatar_url}" style="border-radius:50%;width:80px;height:80px;object-fit:cover;" />` : ''}
                <div class="upload-label">Click to upload profile picture</div>
              </div>
              <input type="file" id="avatar-input" accept="image/*" style="display:none" onchange="previewImage('avatar-input','avatar-preview-img','avatar-preview')" />
            </div>
          </div>

          <div class="field">
            <label>Username</label>
            <input type="text" id="edit-username" value="${currentProfile?.username ?? ''}" maxlength="20" />
          </div>

          <div class="field">
            <label>Bio</label>
            <textarea id="edit-bio" rows="3" placeholder="Tell everyone about yourself...">${currentProfile?.bio ?? ''}</textarea>
          </div>

          <div style="display:flex;gap:8px;margin-top:4px;">
            <button class="btn btn-accent btn-full" onclick="saveProfile()">Save</button>
            <button class="btn btn-full" style="background:var(--surface2);color:var(--text2);" onclick="showOwnProfile()">Cancel</button>
          </div>
        </div>
      </div>
    `
  }

  function previewImage(inputId, imgId, containerId) {
    const file = document.getElementById(inputId)?.files[0]
    if (!file) return
    const reader = new FileReader()
    reader.onload = e => {
      const container = document.getElementById(containerId)
      if (container) {
        const isAvatar = inputId === 'avatar-input'
        container.innerHTML = `<img src="${e.target.result}" style="${isAvatar ? 'border-radius:50%;width:80px;height:80px;object-fit:cover;' : 'max-height:120px;max-width:100%;border-radius:8px;'}" /><div class="upload-label" style="margin-top:6px;">Click to change</div>`
      }
    }
    reader.readAsDataURL(file)
  }

  async function uploadImage(bucket, file) {
    const ext = file.name.split('.').pop()
    const path = `${currentUser.id}/${Date.now()}.${ext}`
    const { error } = await db.storage.from(bucket).upload(path, file, { upsert: true })
    if (error) return null
    const { data } = db.storage.from(bucket).getPublicUrl(path)
    return data.publicUrl
  }

  async function saveProfile() {
    const msg = document.getElementById('edit-msg')
    const username = document.getElementById('edit-username')?.value.trim()
    const bio = document.getElementById('edit-bio')?.value.trim()
    const avatarFile = document.getElementById('avatar-input')?.files[0]
    const bannerFile = document.getElementById('banner-input')?.files[0]

    if (!username || username.length < 3) {
      if (msg) msg.innerHTML = `<div class="msg msg-error">Username must be at least 3 characters</div>`
      return
    }

    if (msg) msg.innerHTML = `<div class="msg msg-success">Saving...</div>`

    let avatar_url = currentProfile?.avatar_url ?? null
    let banner_url = currentProfile?.banner_url ?? null

    if (avatarFile) {
      const url = await uploadImage('avatars', avatarFile)
      if (url) avatar_url = url
    }
    if (bannerFile) {
      const url = await uploadImage('banners', bannerFile)
      if (url) banner_url = url
    }

    const { error } = await db.from('profiles').upsert({ id: currentUser.id, username, bio, avatar_url, banner_url })
    if (error) {
      if (msg) msg.innerHTML = `<div class="msg msg-error">Could not save. Username may be taken!</div>`
    } else {
      await loadCurrentProfile()
      updateNav()
      renderProfile(currentUser.id)
    }
  }

  async function submitPost() {
    const input = document.getElementById('post-input')
    const msg = document.getElementById('post-msg')
    const content = input?.value.trim()
    if (!content) return
    const { error } = await db.from('posts').insert({ content, community: currentCommunity, user_id: currentUser.id })
    if (error) {
      if (msg) msg.innerHTML = `<div class="msg msg-error">Could not post. Try again.</div>`
    } else {
      if (input) input.value = ''
      loadPosts()
    }
  }

  async function toggleYeah(postId, hasYeah) {
    if (!currentUser) { renderAuth(); return }
    if (hasYeah) {
      await db.from('yeahs').delete().eq('post_id', postId).eq('user_id', currentUser.id)
    } else {
      await db.from('yeahs').insert({ post_id: postId, user_id: currentUser.id })
    }
    loadPosts()
  }

  function switchCommunity(id) { currentCommunity = id; renderApp() }

  function renderUsernameSetup() {
    document.getElementById('app').innerHTML = `
      <div class="auth-wrap">
        <div class="auth-card">
          <div class="auth-title">🌀 KlonoaVerse</div>
          <div class="auth-sub">Choose your username!</div>
          <div id="auth-msg"></div>
          <div class="field"><label>Username</label><input type="text" id="username-input" placeholder="e.g. WindDreamer" maxlength="20" /></div>
          <button class="btn btn-accent btn-full" onclick="saveUsername()">Let's go!</button>
        </div>
      </div>
    `
  }

  async function saveUsername() {
    const input = document.getElementById('username-input')
    const msg = document.getElementById('auth-msg')
    const username = input?.value.trim()
    if (!username || username.length < 3) {
      if (msg) msg.innerHTML = `<div class="msg msg-error">Username must be at least 3 characters</div>`
      return
    }
    const { error } = await db.from('profiles').upsert({ id: currentUser.id, username })
    if (error) {
      if (msg) msg.innerHTML = `<div class="msg msg-error">That username may be taken, try another!</div>`
    } else {
      currentProfile = { username }
      updateNav()
      renderApp()
    }
  }

  function renderAuth() {
    document.getElementById('app').innerHTML = `
      <div class="auth-wrap">
        <div class="auth-card">
          <div class="auth-title">🌀 KlonoaVerse</div>
          <div class="auth-sub">${authMode === 'signin' ? 'Welcome back!' : 'Create an account'}</div>
          <div id="auth-msg"></div>
          <div class="field"><label>Email</label><input type="email" id="auth-email" placeholder="you@example.com" /></div>
          <div class="field"><label>Password</label><input type="password" id="auth-password" placeholder="••••••••" /></div>
          <button class="btn btn-accent btn-full" onclick="handleAuth()">
            ${authMode === 'signin' ? 'Sign in' : 'Sign up'}
          </button>
          <div class="auth-switch">
            ${authMode === 'signin'
              ? "Don't have an account? <a onclick='toggleAuthMode()'>Sign up</a>"
              : "Already have an account? <a onclick='toggleAuthMode()'>Sign in</a>"}
          </div>
          <div class="auth-switch" style="margin-top:8px;">
            <a onclick="renderApp()" style="color:var(--text2);">Back to KlonoaVerse</a>
          </div>
        </div>
      </div>
    `
  }

  function toggleAuthMode() { authMode = authMode === 'signin' ? 'signup' : 'signin'; renderAuth() }

  async function handleAuth() {
    const email = document.getElementById('auth-email')?.value.trim()
    const password = document.getElementById('auth-password')?.value
    const msg = document.getElementById('auth-msg')
    if (!email || !password) return
    let result
    if (authMode === 'signup') {
      result = await db.auth.signUp({ email, password })
    } else {
      result = await db.auth.signInWithPassword({ email, password })
    }
    if (result.error) {
      if (msg) msg.innerHTML = `<div class="msg msg-error">${result.error.message}</div>`
    } else {
      if (authMode === 'signup') {
        if (msg) msg.innerHTML = `<div class="msg msg-success">Check your email to confirm your account!</div>`
      } else {
        currentUser = result.data.user
        await loadCurrentProfile()
        updateNav()
        renderApp()
      }
    }
  }

  function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
  }

  db.auth.onAuthStateChange((event, session) => {
    currentUser = session?.user ?? null
    updateNav()
  })

  init()
</script>
</body>
</html>
