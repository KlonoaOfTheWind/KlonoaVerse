<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KlonoaVerse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;700&family=Fredoka+One&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #e8f4f0; --surface: #ffffff; --surface2: #f0faf6; --border: #c2e0d8;
      --accent: #2d7d5e; --accent2: #5ba68a; --accent-light: #d4f0e6;
      --text: #1a3a2e; --text2: #4a7a66;
      --yeah: #e05a8a; --yeah-light: #fce8f0;
      --red: #c0392b; --red-light: #fce8e8;
      --amber: #d4900a; --amber-light: #fef3d4;
      --radius: 12px; --radius-sm: 8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    nav { background: var(--accent); padding: 0 1.5rem; display: flex; align-items: center; justify-content: space-between; height: 52px; position: sticky; top: 0; z-index: 100; }
    .nav-logo { font-family: 'Fredoka One', cursive; font-size: 22px; color: #fff; cursor: pointer; }
    .nav-right { display: flex; align-items: center; gap: 12px; }
    .nav-user { font-size: 13px; color: rgba(255,255,255,0.85); cursor: pointer; text-decoration: underline; }
    .btn { font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 700; padding: 6px 14px; border-radius: 20px; border: none; cursor: pointer; transition: opacity 0.15s; }
    .btn:hover { opacity: 0.85; }
    .btn-white { background: #fff; color: var(--accent); }
    .btn-outline { background: transparent; color: #fff; border: 1.5px solid rgba(255,255,255,0.5); }
    .btn-accent { background: var(--accent); color: #fff; }
    .btn-follow { background: var(--accent-light); color: var(--accent); border: 1.5px solid #a0d8c0; font-size: 12px; padding: 4px 10px; }
    .btn-follow.following { background: var(--surface2); color: var(--text2); border-color: var(--border); }
    .btn-yeah { background: var(--yeah-light); color: var(--yeah); border: 1.5px solid #f0b8cf; font-size: 12px; padding: 4px 10px; }
    .btn-yeah.active { background: var(--yeah); color: #fff; border-color: var(--yeah); }
    .btn-red { background: var(--red-light); color: var(--red); border: 1.5px solid #f0b8b8; font-size: 12px; padding: 4px 10px; }
    .btn-amber { background: var(--amber-light); color: var(--amber); border: 1.5px solid #f0d8a0; font-size: 12px; padding: 4px 10px; }
    .btn-green { background: var(--accent-light); color: var(--accent); border: 1.5px solid #a0d8c0; font-size: 12px; padding: 4px 10px; }

    /* MAIN LAYOUT */
    .layout { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 1.25rem; max-width: 960px; margin: 1.25rem auto; padding: 0 1rem; }
    @media (max-width: 700px) { .layout { grid-template-columns: 1fr; } .sidebar { display: none; } }
    .sidebar { display: flex; flex-direction: column; gap: 12px; position: sticky; top: 64px; max-height: calc(100vh - 80px); overflow-y: auto; }
    .sidebar::-webkit-scrollbar { width: 4px; } .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    .main { display: flex; flex-direction: column; gap: 12px; }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; }
    .card-title { font-size: 11px; font-weight: 700; color: var(--text2); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
    .card-title a { font-size: 11px; color: var(--accent); cursor: pointer; font-weight: 700; text-transform: none; letter-spacing: 0; }

    /* COMMUNITY SIDEBAR ITEMS */
    .community-item { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: var(--radius-sm); cursor: pointer; transition: background 0.12s; }
    .community-item:hover, .community-item.active { background: var(--surface2); }
    .community-icon { width: 30px; height: 30px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; overflow: hidden; background: var(--accent-light); }
    .community-icon img { width: 100%; height: 100%; object-fit: cover; }
    .community-name { font-size: 13px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .profile-card { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .avatar { border-radius: 50%; background: var(--accent-light); color: var(--accent); font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; overflow: hidden; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }

    /* COMMUNITY HEADER */
    .community-header { border-radius: var(--radius); overflow: hidden; }
    .community-header-banner { height: 110px; background: linear-gradient(135deg, #2d7d5e, #5ba68a); position: relative; overflow: hidden; }
    .community-header-banner img { width: 100%; height: 100%; object-fit: cover; }
    .community-header-info { background: var(--accent); padding: 10px 1.25rem 1rem; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
    .community-header-left { display: flex; align-items: flex-end; gap: 12px; }
    .community-header-icon { width: 44px; height: 44px; border-radius: var(--radius-sm); background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; overflow: hidden; margin-top: -22px; border: 3px solid rgba(255,255,255,0.3); }
    .community-header-icon img { width: 100%; height: 100%; object-fit: cover; }

    /* POSTS */
    .new-post { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; }
    .new-post-row { display: flex; gap: 10px; align-items: flex-start; }
    textarea { font-family: 'Nunito', sans-serif; font-size: 14px; color: var(--text); background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; width: 100%; resize: none; outline: none; transition: border 0.15s; }
    textarea:focus { border-color: var(--accent2); }
    .new-post-actions { display: flex; justify-content: flex-end; margin-top: 8px; }
    .post { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem 1.25rem; animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .post-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .post-user { font-size: 14px; font-weight: 700; color: var(--text); cursor: pointer; }
    .post-user:hover { text-decoration: underline; }
    .post-meta { font-size: 11px; color: var(--text2); }
    .post-community-link { font-size: 11px; color: var(--accent); cursor: pointer; font-weight: 700; }
    .post-community-link:hover { text-decoration: underline; }
    .post-body { font-size: 14px; color: var(--text); line-height: 1.65; margin-bottom: 12px; }
    .post-footer { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    /* AUTH */
    .auth-wrap { max-width: 400px; margin: 3rem auto; padding: 0 1rem; }
    .auth-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 2rem; }
    .auth-title { font-family: 'Fredoka One', cursive; font-size: 28px; color: var(--accent); text-align: center; margin-bottom: 4px; }
    .auth-sub { font-size: 13px; color: var(--text2); text-align: center; margin-bottom: 1.5rem; }
    .field { margin-bottom: 12px; }
    .field label { font-size: 12px; font-weight: 700; color: var(--text2); display: block; margin-bottom: 4px; }
    input[type=text], input[type=email], input[type=password] { font-family: 'Nunito', sans-serif; font-size: 14px; color: var(--text); background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 9px 12px; width: 100%; outline: none; transition: border 0.15s; }
    select { font-family: 'Nunito', sans-serif; font-size: 14px; color: var(--text); background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 9px 12px; width: 100%; outline: none; }
    input:focus { border-color: var(--accent2); }
    .btn-full { width: 100%; padding: 10px; font-size: 15px; border-radius: var(--radius-sm); margin-top: 4px; }
    .auth-switch { font-size: 13px; color: var(--text2); text-align: center; margin-top: 1rem; }
    .auth-switch a { color: var(--accent); cursor: pointer; font-weight: 700; text-decoration: none; }
    .msg { font-size: 12px; padding: 8px 12px; border-radius: var(--radius-sm); margin-bottom: 12px; text-align: center; }
    .msg-error { background: #fce8e8; color: #c0392b; }
    .msg-success { background: var(--accent-light); color: var(--accent); }
    .empty { text-align: center; padding: 3rem 1rem; color: var(--text2); font-size: 14px; }
    .empty-icon { font-size: 40px; margin-bottom: 8px; }
    .loading { text-align: center; padding: 2rem; color: var(--text2); font-size: 14px; }
    .badge { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 20px; display: inline-block; }
    .badge-admin { background: #fff3cd; color: #856404; }
    .badge-banned { background: var(--red-light); color: var(--red); }
    .badge-warned { background: var(--amber-light); color: var(--amber); }
    .badge-official { background: #dceeff; color: #185FA5; }

    /* PROFILE PAGE */
    .profile-page { max-width: 680px; margin: 0 auto; padding: 0 1rem 2rem; }
    .profile-banner { width: 100%; height: 150px; background: linear-gradient(135deg, #2d7d5e, #5ba68a); border-radius: var(--radius) var(--radius) 0 0; overflow: hidden; position: relative; }
    .profile-banner img { width: 100%; height: 100%; object-fit: cover; }
    .profile-banner-edit { position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.5); color: #fff; border: none; border-radius: 20px; padding: 4px 10px; font-size: 11px; cursor: pointer; font-family: 'Nunito', sans-serif; font-weight: 700; }
    .profile-info-card { background: var(--surface); border: 1px solid var(--border); border-radius: 0 0 var(--radius) var(--radius); padding: 0 1.25rem 1.25rem; margin-bottom: 1rem; }
    .profile-avatar-wrap { position: relative; display: inline-block; margin-top: -36px; margin-bottom: 8px; }
    .profile-username { font-family: 'Fredoka One', cursive; font-size: 22px; color: var(--text); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .profile-bio { font-size: 13px; color: var(--text2); margin-top: 4px; line-height: 1.5; }
    .profile-actions { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
    .profile-stats { display: flex; gap: 16px; margin-top: 8px; }
    .profile-stat { font-size: 13px; color: var(--text2); cursor: pointer; }
    .profile-stat span { font-weight: 700; color: var(--text); }

    /* EDIT */
    .edit-wrap { max-width: 500px; margin: 2rem auto; padding: 0 1rem; }
    .upload-area { border: 2px dashed var(--border); border-radius: var(--radius-sm); padding: 1.5rem; text-align: center; cursor: pointer; transition: border 0.15s; background: var(--surface2); }
    .upload-area:hover { border-color: var(--accent2); }
    .upload-area img { max-height: 120px; max-width: 100%; border-radius: var(--radius-sm); margin-bottom: 8px; }
    .upload-label { font-size: 12px; color: var(--text2); }

    /* BACKGROUND */
    .page-bg { position: fixed; inset: 0; z-index: -1; background-size: cover; background-position: center; background-attachment: fixed; transition: opacity 0.3s; }
    .page-bg::after { content: ''; position: absolute; inset: 0; background: rgba(0,0,0,0.45); }

    /* MUSIC PLAYER */
    .music-player { position: fixed; bottom: 16px; right: 16px; z-index: 150; background: rgba(0,0,0,0.75); backdrop-filter: blur(8px); border-radius: 30px; padding: 8px 14px; display: flex; align-items: center; gap: 10px; color: #fff; font-size: 12px; font-weight: 700; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
    .music-player-icon { font-size: 16px; cursor: pointer; }
    .music-player-title { max-width: 140px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0.85; }
    .music-player-close { cursor: pointer; opacity: 0.6; font-size: 14px; }
    .music-player-close:hover { opacity: 1; }

    /* MAINTENANCE */
    .maintenance { text-align: center; padding: 4rem 1rem; }
    .maintenance-icon { font-size: 60px; margin-bottom: 1rem; }
    .maintenance h1 { font-family: 'Fredoka One', cursive; font-size: 32px; color: var(--accent); margin-bottom: 8px; }
    .maintenance p { font-size: 14px; color: var(--text2); }

    /* MODAL */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .modal { background: var(--surface); border-radius: var(--radius); padding: 1.5rem; max-width: 400px; width: 100%; max-height: 90vh; overflow-y: auto; }
    .modal h3 { font-family: 'Fredoka One', cursive; font-size: 20px; color: var(--text); margin-bottom: 1rem; }
    .modal-actions { display: flex; gap: 8px; margin-top: 1rem; }

    /* ADMIN BAR */
    .admin-bar { background: #fff3cd; border: 1px solid #f0d060; border-radius: var(--radius); padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .admin-bar-title { font-size: 13px; font-weight: 700; color: #856404; }

    /* FEED TABS */
    .feed-tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 6px; }
    .feed-tab { flex: 1; text-align: center; font-size: 13px; font-weight: 700; padding: 6px; border-radius: var(--radius-sm); cursor: pointer; color: var(--text2); transition: background 0.12s; }
    .feed-tab.active { background: var(--accent); color: #fff; }

    /* COMMUNITY GRID */
    .community-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
    .community-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; cursor: pointer; transition: transform 0.15s; }
    .community-card:hover { transform: translateY(-2px); }
    .community-card-banner { height: 65px; background: linear-gradient(135deg, #2d7d5e, #5ba68a); overflow: hidden; }
    .community-card-banner img { width: 100%; height: 100%; object-fit: cover; }
    .community-card-body { padding: 8px 10px 10px; display: flex; gap: 8px; }
    .community-card-icon { width: 34px; height: 34px; border-radius: var(--radius-sm); background: var(--accent-light); display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0; overflow: hidden; margin-top: -20px; border: 2px solid #fff; }
    .community-card-icon img { width: 100%; height: 100%; object-fit: cover; }
    .community-card-name { font-size: 13px; font-weight: 700; color: var(--text); margin-top: 6px; }
    .community-card-desc { font-size: 11px; color: var(--text2); margin-top: 2px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  </style>
</head>
<body>
<nav>
  <div class="nav-logo" onclick="showHome()">🌀 KlonoaVerse</div>
  <div class="nav-right">
    <span class="nav-user" id="nav-username" onclick="showOwnProfile()"></span>
    <button class="btn btn-outline" id="nav-auth-btn" onclick="handleAuthBtn()">Sign in</button>
  </div>
</nav>
<div id="page-bg" class="page-bg" style="display:none;"></div>
<div id="app"></div>
<div id="modal-container"></div>
<div id="music-player" style="display:none;" class="music-player">
  <span class="music-player-icon" id="music-toggle" onclick="toggleMusic()">⏸️</span>
  <span class="music-player-title" id="music-title">Now playing</span>
  <span class="music-player-close" onclick="stopMusic()">✕</span>
</div>
<iframe id="yt-player" width="0" height="0" style="display:none;" allow="autoplay"></iframe>

<script>
  const SUPABASE_URL = 'https://jvxhqzmybeeeanflazuo.supabase.co'
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp2eGhxem15YmVlZWFuZmxhenVvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzOTYxMjIsImV4cCI6MjA5NDk3MjEyMn0.swj3-6nFWPlXjqttBWPEBssv-1TFmJ71xLLnaRlIzSI'
  const { createClient } = supabase
  const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

  let currentUser = null
  let currentProfile = null
  let currentCommunity = null
  let authMode = 'signin'
  let profileCache = {}
  let communityCache = {}
  let maintenanceMode = false
  let feedTab = 'all' // 'all' or 'following'
  let followedCommunities = []
  let followedUsers = []

  const isAdmin = () => currentProfile?.role === 'admin'

  async function init() {
    maintenanceMode = localStorage.getItem("kv_maintenance") === "true"
    const { data: { session } } = await db.auth.getSession()
    currentUser = session?.user ?? null
    if (currentUser) {
      try {
        await loadCurrentProfile()
        await loadFollows()
      } catch(e) {
        console.error("Profile load error:", e)
      }
    }
    updateNav()
    renderHome()
  }

  async function loadCurrentProfile() {
    const { data } = await db.from('profiles').select('*').eq('id', currentUser.id).single()
    currentProfile = data
  }

  async function loadFollows() {
    if (!currentUser) return
    const { data } = await db.from('follows').select('following_id, following_type').eq('follower_id', currentUser.id)
    followedCommunities = data?.filter(f => f.following_type === 'community').map(f => f.following_id) ?? []
    followedUsers = data?.filter(f => f.following_type === 'user').map(f => f.following_id) ?? []
  }

  function isFollowingCommunity(id) { return followedCommunities.includes(id) }
  function isFollowingUser(id) { return followedUsers.includes(id) }

  async function toggleFollowCommunity(communityId) {
    if (!currentUser) { renderAuth(); return }
    if (isFollowingCommunity(communityId)) {
      await db.from('follows').delete().eq('follower_id', currentUser.id).eq('following_id', communityId)
      followedCommunities = followedCommunities.filter(id => id !== communityId)
    } else {
      await db.from('follows').insert({ follower_id: currentUser.id, following_id: communityId, following_type: 'community' })
      followedCommunities.push(communityId)
    }
    return isFollowingCommunity(communityId)
  }

  async function toggleFollowUser(userId) {
    if (!currentUser) { renderAuth(); return }
    if (isFollowingUser(userId)) {
      await db.from('follows').delete().eq('follower_id', currentUser.id).eq('following_id', userId)
      followedUsers = followedUsers.filter(id => id !== userId)
    } else {
      await db.from('follows').insert({ follower_id: currentUser.id, following_id: userId, following_type: 'user' })
      followedUsers.push(userId)
    }
    return isFollowingUser(userId)
  }

  function getAvatarHtml(profile, size = 36) {
    if (profile?.avatar_url) return `<div class="avatar" style="width:${size}px;height:${size}px;"><img src="${profile.avatar_url}" alt="avatar" /></div>`
    return `<div class="avatar" style="width:${size}px;height:${size}px;font-size:${Math.floor(size*0.35)}px;">${(profile?.username?.[0] ?? '?').toUpperCase()}</div>`
  }

  function updateNav() {
    const btn = document.getElementById('nav-auth-btn')
    const userEl = document.getElementById('nav-username')
    if (currentUser) {
      userEl.textContent = (currentProfile?.username || currentUser.email?.split('@')[0] || 'User') + (isAdmin() ? ' 👑' : '')
      btn.textContent = 'Sign out'
      btn.className = 'btn btn-outline'
    } else {
      userEl.textContent = ''
      btn.textContent = 'Sign in'
      btn.className = 'btn btn-white'
    }
  }

  function handleAuthBtn() {
    if (currentUser) {
      db.auth.signOut().then(() => { currentUser = null; currentProfile = null; profileCache = {}; followedCommunities = []; followedUsers = []; updateNav(); renderHome() })
    } else renderAuth()
  }

  function showHome() { currentCommunity = null; feedTab = 'all'; setPageBackground(null); stopMusic(); renderHome() }
  function showOwnProfile() { if (currentUser) renderProfile(currentUser.id) }

  async function renderHome() {
    if (currentUser && !currentProfile?.username) { renderUsernameSetup(); return }
    if (maintenanceMode && !isAdmin()) {
      document.getElementById('app').innerHTML = `<div class="maintenance"><div class="maintenance-icon">🔧</div><h1>KlonoaVerse is under maintenance</h1><p>We'll be back soon!</p></div>`
      return
    }
    const { data: allCommunities } = await db.from('communities').select('*').eq('banned', false).order('created_at', { ascending: false })
    const communities = allCommunities ?? []
    allCommunities?.forEach(c => { communityCache[c.id] = c })

    const followedComms = communities.filter(c => followedCommunities.includes(c.id))

    document.getElementById('app').innerHTML = `
      <div class="layout">
        <aside class="sidebar">
          ${isAdmin() ? `
          <div class="admin-bar">
            <span class="admin-bar-title">👑 Admin</span>
            <button class="btn btn-amber" style="font-size:11px;padding:3px 8px;" onclick="toggleMaintenance()">${maintenanceMode ? '✅ Site ON' : '🔴 Site OFF'}</button>
          </div>` : ''}
          ${currentUser ? `
          <div class="card" style="padding:0.75rem;">
            <div class="profile-card" onclick="showOwnProfile()">
              ${getAvatarHtml(currentProfile, 36)}
              <div>
                <div style="font-size:13px;font-weight:700;">${currentProfile?.username ?? ''}${isAdmin() ? ' 👑' : ''}</div>
                <div style="font-size:11px;color:var(--text2);">View profile</div>
              </div>
            </div>
          </div>` : ''}
          <div class="card" style="padding:0.75rem;">
            <div class="card-title">Communities <a onclick="renderCreateCommunity()">+ New</a></div>
            ${communities.length === 0
              ? `<div style="font-size:12px;color:var(--text2);">No communities yet!</div>`
              : communities.map(c => `
                <div class="community-item ${currentCommunity?.id === c.id ? 'active' : ''}" onclick="openCommunity('${c.id}')">
                  <div class="community-icon">${c.icon_url ? `<img src="${c.icon_url}" />` : '🌀'}</div>
                  <div class="community-name">${escapeHtml(c.name)}</div>
                </div>`).join('')
            }
          </div>
          ${currentUser && followedComms.length > 0 ? `
          <div class="card" style="padding:0.75rem;">

  async function loadHomeFeed() {

      if (allFollowed.length === 0 && followedUsers.length === 0) {
        container.innerHTML = `<div class="empty"><div class="empty-icon">❤️</div>Follow communities and people to see their posts here!</div>`

    }
    const { data, error } = await query
    renderPostList(container, data, error, true)
  }

  async function renderPostList(container, data, error, showCommunity) {
    if (error || !data || data.length === 0) {
      container.innerHTML = `<div class="empty"><div class="empty-icon">🌀</div>No posts yet!</div>`
      return
    }
    let yeahMap = {}
    if (currentUser) {
      const ids = data.map(p => p.id)
      const { data: yeahs } = await db.from('yeahs').select('post_id').eq('user_id', currentUser.id).in('post_id', ids)
      yeahs?.forEach(y => { yeahMap[y.post_id] = true })
    }
    const { data: yeahCounts } = await db.from('yeahs').select('post_id')
    const countMap = {}
    yeahCounts?.forEach(y => { countMap[y.post_id] = (countMap[y.post_id] || 0) + 1 })
    const userIds = [...new Set(data.map(p => p.user_id).filter(Boolean))]
    if (userIds.length > 0) {
      const { data: profiles } = await db.from('profiles').select('id, username, avatar_url, role').in('id', userIds)
      profiles?.forEach(p => { profileCache[p.id] = p })
    }
    container.innerHTML = data.map(post => {
      const profile = profileCache[post.user_id] || {}
      const username = profile.username || post.user_id?.slice(0, 8) || 'Anonymous'
      const avatarContent = profile.avatar_url
        ? `<img src="${profile.avatar_url}" alt="avatar" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" />`
        : username[0].toUpperCase()
      const date = new Date(post.created_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })
      const yeah = yeahMap[post.id]
      const count = countMap[post.id] || 0
      const comm = showCommunity && post.community_id ? communityCache[post.community_id] : null
      return `
        <div class="post" id="post-${post.id}">
          <div class="post-header">
            <div class="avatar" style="width:36px;height:36px;">${avatarContent}</div>
            <div>
              <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
                <span class="post-user" onclick="renderProfile('${post.user_id}')">${username}</span>
                ${profile.role === 'admin' ? '<span class="badge badge-admin">👑 Admin</span>' : ''}
              </div>
              <div class="post-meta">
                ${date}
                ${comm ? `· <span class="post-community-link" onclick="openCommunity('${comm.id}')">${escapeHtml(comm.name)}</span>` : ''}
              </div>
            </div>
          </div>
          <div class="post-body">${escapeHtml(post.content)}</div>
          <div class="post-footer">
            <button class="btn btn-yeah ${yeah ? 'active' : ''}" onclick="toggleYeah('${post.id}', ${yeah})">Yeah! ${count > 0 ? count : ''}</button>
            ${isAdmin() ? `<button class="btn btn-red" onclick="confirmDeletePost('${post.id}')">🗑️ Delete</button>` : ''}
          </div>
        </div>`
    }).join('')
  }

  async function saveCommunity() {
    const msg = document.getElementById('create-msg')
    const name = document.getElementById('c-name')?.value.trim()
    const description = document.getElementById('c-desc')?.value.trim()
    const music_url = document.getElementById('c-music')?.value.trim() || null
    const iconFile = document.getElementById('c-icon-input')?.files[0]
    const bannerFile = document.getElementById('c-banner-input')?.files[0]
    const bgFile = document.getElementById('c-bg-input')?.files[0]
    if (!name) { if (msg) msg.innerHTML = `<div class="msg msg-error">Name is required!</div>`; return }
    if (msg) msg.innerHTML = `<div class="msg msg-success">Creating...</div>`
    let icon_url = null, banner_url = null, background_url = null
    if (iconFile) icon_url = await uploadImage('community-icons', iconFile)
    if (bannerFile) banner_url = await uploadImage('community-banners', bannerFile)
    if (bgFile) background_url = await uploadImage('backgrounds', bgFile)
    const { error } = await db.from('communities').insert({ name, description, icon_url, banner_url, background_url, music_url, owner_id: currentUser.id })
    if (error) { if (msg) msg.innerHTML = `<div class="msg msg-error">Could not create community!</div>` }
    else { showHome() }
  }

  async function updateCommunity(communityId, existingIcon, existingBanner, existingBg) {
    const msg = document.getElementById('edit-community-msg')
    const name = document.getElementById('ec-name')?.value.trim()
    const description = document.getElementById('ec-desc')?.value.trim()
    const music_url = document.getElementById('ec-music')?.value.trim() || null
    const iconFile = document.getElementById('ec-icon-input')?.files[0]
    const bannerFile = document.getElementById('ec-banner-input')?.files[0]
    const bgFile = document.getElementById('ec-bg-input')?.files[0]
    if (!name) { if (msg) msg.innerHTML = `<div class="msg msg-error">Name is required!</div>`; return }
    if (msg) msg.innerHTML = `<div class="msg msg-success">Saving...</div>`
    let icon_url = existingIcon || null
    let banner_url = existingBanner || null
    let background_url = existingBg || null
    if (iconFile) icon_url = await uploadImage('community-icons', iconFile)
    if (bannerFile) banner_url = await uploadImage('community-banners', bannerFile)
    if (bgFile) background_url = await uploadImage('backgrounds', bgFile)
    const { error } = await db.from('communities').update({ name, description, icon_url, banner_url, background_url, music_url }).eq('id', communityId)
    if (error) { if (msg) msg.innerHTML = `<div class="msg msg-error">Could not save!</div>` }
    else { openCommunity(communityId) }
  }

  // ADMIN COMMUNITY ACTIONS
  async function warnCommunity(communityId, communityName, currentWarnings) {
    showModal(`<h3>⚠️ Warn "${communityName}"?</h3><p style="font-size:14px;color:var(--text2);">Currently has ${currentWarnings} warning(s).</p>
      <div class="modal-actions">
        <button class="btn btn-amber btn-full" onclick="doWarnCommunity('${communityId}', ${currentWarnings})">Yes, warn</button>
        <button class="btn btn-full" style="background:var(--surface2);color:var(--text2);" onclick="closeModal()">Cancel</button>
      </div>`)
  }
  async function doWarnCommunity(communityId, currentWarnings) { closeModal(); await db.from('communities').update({ warning_count: currentWarnings + 1 }).eq('id', communityId); openCommunity(communityId) }
  async function banCommunity(communityId, communityName) {
    showModal(`<h3>🔨 Ban "${communityName}"?</h3><p style="font-size:14px;color:var(--text2);">This community will be hidden from all users.</p>
      <div class="modal-actions">
        <button class="btn btn-red btn-full" onclick="doBanCommunity('${communityId}')">Yes, ban</button>
        <button class="btn btn-full" style="background:var(--surface2);color:var(--text2);" onclick="closeModal()">Cancel</button>
      </div>`)
  }
  async function doBanCommunity(communityId) { closeModal(); await db.from('communities').update({ banned: true }).eq('id', communityId); showHome() }
  async function unbanCommunity(communityId) {
    showModal(`<h3>✅ Unban this community?</h3>
      <div class="modal-actions">
        <button class="btn btn-green btn-full" onclick="doUnbanCommunity('${communityId}')">Yes, unban</button>
        <button class="btn btn-full" style="background:var(--surface2);color:var(--text2);" onclick="closeModal()">Cancel</button>
      </div>`)
  }
  async function doUnbanCommunity(communityId) { closeModal(); await db.from('communities').update({ banned: false }).eq('id', communityId); openCommunity(communityId) }

  async function toggleOfficial(communityId, currentlyOfficial) {
    await db.from('communities').update({ official: !currentlyOfficial }).eq('id', communityId)
    openCommunity(communityId)
  }

  // ADMIN USER ACTIONS
  async function warnUser(userId, username, currentWarnings) {
    showModal(`<h3>⚠️ Warn ${username}?</h3><p style="font-size:14px;color:var(--text2);">They currently have ${currentWarnings} warning(s).</p>
      <div class="modal-actions">
        <button class="btn btn-amber btn-full" onclick="sendWarning('${userId}', ${currentWarnings})">Yes, warn</button>
        <button class="btn btn-full" style="background:var(--surface2);color:var(--text2);" onclick="closeModal()">Cancel</button>
      </div>`)
  }
  async function sendWarning(userId, currentWarnings) { closeModal(); await db.from('profiles').update({ warning_count: currentWarnings + 1 }).eq('id', userId); renderProfile(userId) }
  function showBanModal(userId, username) {
    showModal(`<h3>🔨 Ban ${username}?</h3>
      <div class="field" style="margin-top:1rem;"><label>Ban duration</label>
        <select id="ban-duration">
          <option value="1">1 day</option><option value="3">3 days</option>
          <option value="7">1 week</option><option value="30">1 month</option>
          <option value="0">Permanent</option>
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn btn-red btn-full" onclick="banUser('${userId}')">Ban</button>
        <button class="btn btn-full" style="background:var(--surface2);color:var(--text2);" onclick="closeModal()">Cancel</button>
      </div>`)
  }
  async function banUser(userId) {
    const days = parseInt(document.getElementById('ban-duration').value)
    let banned_until = null
    if (days > 0) { const d = new Date(); d.setDate(d.getDate() + days); banned_until = d.toISOString() }
    closeModal(); await db.from('profiles').update({ banned: true, banned_until }).eq('id', userId); renderProfile(userId)
  }
  async function unbanUser(userId, username) {
    showModal(`<h3>✅ Unban ${username}?</h3>
      <div class="modal-actions">
        <button class="btn btn-green btn-full" onclick="doUnban('${userId}')">Yes, unban</button>
        <button class="btn btn-full" style="background:var(--surface2);color:var(--text2);" onclick="closeModal()">Cancel</button>
      </div>`)
  }
  async function doUnban(userId) { closeModal(); await db.from('profiles').update({ banned: false, banned_until: null }).eq('id', userId); renderProfile(userId) }

  function confirmDeletePost(postId) {
    showModal(`<h3>🗑️ Delete post?</h3><p style="font-size:14px;color:var(--text2);">This cannot be undone.</p>
      <div class="modal-actions">
        <button class="btn btn-red btn-full" onclick="deletePost('${postId}')">Yes, delete</button>
        <button class="btn btn-full" style="background:var(--surface2);color:var(--text2);" onclick="closeModal()">Cancel</button>
      </div>`)
  }
  async function deletePost(postId) { closeModal(); await db.from('posts').delete().eq('id', postId); currentCommunity ? loadCommunityPosts() : loadHomeFeed() }

  function showModal(html) {
    document.getElementById('modal-container').innerHTML = `<div class="modal-overlay" onclick="closeModal()"><div class="modal" onclick="event.stopPropagation()">${html}</div></div>`
  }
  function closeModal() { document.getElementById('modal-container').innerHTML = '' }

  async function submitPost() {
    const input = document.getElementById('post-input')
    const msg = document.getElementById('post-msg')
    const content = input?.value.trim()
    if (!content) return
    if (currentProfile?.banned) {
      const stillBanned = !currentProfile.banned_until || new Date(currentProfile.banned_until) > new Date()
      if (stillBanned) { if (msg) msg.innerHTML = `<div class="msg msg-error">You are banned from posting.</div>`; return }
    }
    const { error } = await db.from('posts').insert({ content, community_id: currentCommunity.id, community: currentCommunity.name, user_id: currentUser.id })
    if (error) { if (msg) msg.innerHTML = `<div class="msg msg-error">Could not post. Try again.</div>` }
    else { if (input) input.value = ''; loadCommunityPosts() }
  }

  async function toggleYeah(postId, hasYeah) {
    if (!currentUser) { renderAuth(); return }
    if (hasYeah) { await db.from('yeahs').delete().eq('post_id', postId).eq('user_id', currentUser.id) }
    else { await db.from('yeahs').insert({ post_id: postId, user_id: currentUser.id }) }
    currentCommunity ? loadCommunityPosts() : loadHomeFeed()
  }

  function renderEditProfile() {
    document.getElementById('app').innerHTML = `
      <div class="edit-wrap">
        <div class="card">
          <div style="font-family:'Fredoka One',cursive;font-size:22px;color:var(--accent);margin-bottom:1.5rem;">Edit profile</div>
          <div id="edit-msg"></div>
          <div class="field"><label>Banner image</label>
            <div class="upload-area" onclick="document.getElementById('banner-input').click()">
              <div id="banner-preview">${currentProfile?.banner_url ? `<img src="${currentProfile.banner_url}" />` : '<div class="upload-label">Click to upload banner</div>'}</div>
              <input type="file" id="banner-input" accept="image/*" style="display:none" onchange="previewImage('banner-input','banner-preview',false)" />
            </div>
          </div>
          <div class="field"><label>Profile picture</label>
            <div class="upload-area" onclick="document.getElementById('avatar-input').click()">
              <div id="avatar-preview">${currentProfile?.avatar_url ? `<img src="${currentProfile.avatar_url}" style="border-radius:50%;width:80px;height:80px;object-fit:cover;" />` : '<div class="upload-label">Click to upload profile picture</div>'}</div>
              <input type="file" id="avatar-input" accept="image/*" style="display:none" onchange="previewImage('avatar-input','avatar-preview',true)" />
            </div>
          </div>
          <div class="field"><label>Username</label><input type="text" id="edit-username" value="${currentProfile?.username ?? ''}" maxlength="20" /></div>
          <div class="field"><label>Bio</label><textarea id="edit-bio" rows="3" placeholder="Tell everyone about yourself...">${currentProfile?.bio ?? ''}</textarea></div>
          <div class="field">
            <label>Background image</label>
            <div class="upload-area" onclick="document.getElementById('bg-input').click()">
              <div id="bg-preview">${currentProfile?.background_url ? `<img src="${currentProfile.background_url}" />` : '<div class="upload-label">Click to upload background image</div>'}</div>
              <input type="file" id="bg-input" accept="image/*" style="display:none" onchange="previewImage('bg-input','bg-preview',false)" />
            </div>
          </div>
          <div class="field">
            <label>Profile music (YouTube URL)</label>
            <input type="text" id="edit-music" value="${currentProfile?.music_url ?? ''}" placeholder="https://www.youtube.com/watch?v=..." />
            <div style="font-size:11px;color:var(--text2);margin-top:4px;">Visitors will hear this when they visit your profile</div>
          </div>
          <div style="display:flex;gap:8px;margin-top:4px;">
            <button class="btn btn-accent btn-full" onclick="saveProfile()">Save</button>
            <button class="btn btn-full" style="background:var(--surface2);color:var(--text2);" onclick="showOwnProfile()">Cancel</button>
          </div>
        </div>
      </div>`
  }

  function previewImage(inputId, containerId, isSquare) {
    const file = document.getElementById(inputId)?.files[0]
    if (!file) return
    const reader = new FileReader()
    reader.onload = e => {
      const container = document.getElementById(containerId)
      if (container) container.innerHTML = `<img src="${e.target.result}" style="${isSquare ? 'width:80px;height:80px;object-fit:cover;border-radius:8px;' : 'max-height:120px;max-width:100%;border-radius:8px;'}" /><div class="upload-label" style="margin-top:6px;">Click to change</div>`
    }
    reader.readAsDataURL(file)
  }

  async function uploadImage(bucket, file) {
    const ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '')
    const path = `${currentUser.id}/${Date.now()}.${ext}`
    const { error } = await db.storage.from(bucket).upload(path, file, { upsert: true, contentType: file.type })
    if (error) { console.error('Upload error:', error); return null }
    const { data } = db.storage.from(bucket).getPublicUrl(path)
    return data.publicUrl
  }

  async function saveProfile() {
    const msg = document.getElementById('edit-msg')
    const username = document.getElementById('edit-username')?.value.trim()
    const bio = document.getElementById('edit-bio')?.value.trim()
    const music_url = document.getElementById('edit-music')?.value.trim() || null
    const avatarFile = document.getElementById('avatar-input')?.files[0]
    const bannerFile = document.getElementById('banner-input')?.files[0]
    const bgFile = document.getElementById('bg-input')?.files[0]
    if (!username || username.length < 3) { if (msg) msg.innerHTML = `<div class="msg msg-error">Username must be at least 3 characters</div>`; return }
    if (msg) msg.innerHTML = `<div class="msg msg-success">Saving...</div>`
    let avatar_url = currentProfile?.avatar_url ?? null
    let banner_url = currentProfile?.banner_url ?? null
    let background_url = currentProfile?.background_url ?? null
    if (avatarFile) { const url = await uploadImage('avatars', avatarFile); if (url) avatar_url = url }
    if (bannerFile) { const url = await uploadImage('banners', bannerFile); if (url) banner_url = url }
    if (bgFile) { const url = await uploadImage('backgrounds', bgFile); if (url) background_url = url }
    const { error } = await db.from('profiles').upsert({ id: currentUser.id, username, bio, avatar_url, banner_url, background_url, music_url })
    if (error) { if (msg) msg.innerHTML = `<div class="msg msg-error">Could not save. Username may be taken!</div>` }
    else { await loadCurrentProfile(); updateNav(); renderProfile(currentUser.id) }
  }

  function renderUsernameSetup() {
    document.getElementById('app').innerHTML = `
      <div class="auth-wrap"><div class="auth-card">
        <div class="auth-title">🌀 KlonoaVerse</div>
        <div class="auth-sub">Choose your username!</div>
        <div id="auth-msg"></div>
        <div class="field"><label>Username</label><input type="text" id="username-input" placeholder="e.g. WindDreamer" maxlength="20" /></div>
        <button class="btn btn-accent btn-full" onclick="saveUsername()">Let's go!</button>
      </div></div>`
  }

  async function saveUsername() {
    const input = document.getElementById('username-input')
    const msg = document.getElementById('auth-msg')
    const username = input?.value.trim()
    if (!username || username.length < 3) { if (msg) msg.innerHTML = `<div class="msg msg-error">Username must be at least 3 characters</div>`; return }
    const { error } = await db.from('profiles').upsert({ id: currentUser.id, username })
    if (error) { if (msg) msg.innerHTML = `<div class="msg msg-error">That username may be taken, try another!</div>` }
    else { currentProfile = { username }; updateNav(); renderHome() }
  }

  function renderAuth() {
    setPageBackground('https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Fwallpaperaccess.com%2Ffull%2F637888.jpg&f=1&nofb=1&ipt=9c0302e2a95512cdc6830bf39150bf0aba1ffb198a3c7f5972462ae3f3f9a09f')
    document.getElementById('app').innerHTML = `
      <div class="auth-wrap"><div class="auth-card">
        <div class="auth-title">🌀 KlonoaVerse</div>
        <div class="auth-sub">${authMode === 'signin' ? 'Welcome back!' : 'Create an account'}</div>
        <div id="auth-msg"></div>
        <div class="field"><label>Email</label><input type="email" id="auth-email" placeholder="you@example.com" /></div>
        <div class="field"><label>Password</label><input type="password" id="auth-password" placeholder="••••••••" /></div>
        <button class="btn btn-accent btn-full" onclick="handleAuth()">${authMode === 'signin' ? 'Sign in' : 'Sign up'}</button>
        <div class="auth-switch">${authMode === 'signin' ? "Don't have an account? <a onclick='toggleAuthMode()'>Sign up</a>" : "Already have an account? <a onclick='toggleAuthMode()'>Sign in</a>"}</div>
        <div class="auth-switch" style="margin-top:8px;"><a onclick="setPageBackground(null);renderHome()" style="color:var(--text2);">Back to KlonoaVerse</a></div>
      </div></div>`
  }

  function toggleAuthMode() { authMode = authMode === 'signin' ? 'signup' : 'signin'; renderAuth() }

  async function handleAuth() {
    const email = document.getElementById('auth-email')?.value.trim()
    const password = document.getElementById('auth-password')?.value
    const msg = document.getElementById('auth-msg')
    if (!email || !password) return
    let result
    if (authMode === 'signup') { result = await db.auth.signUp({ email, password }) }
    else { result = await db.auth.signInWithPassword({ email, password }) }
    if (result.error) { if (msg) msg.innerHTML = `<div class="msg msg-error">${result.error.message}</div>` }
    else {
      if (authMode === 'signup') { if (msg) msg.innerHTML = `<div class="msg msg-success">Check your email to confirm your account!</div>` }
      else { currentUser = result.data.user; try { await loadCurrentProfile(); await loadFollows(); } catch(e) { console.error("Login profile error:", e) } updateNav(); renderHome() }
    }
  }

  function escapeHtml(str) {
    if (!str) return ''
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
  }

  // BACKGROUND
  function setPageBackground(url) {
    const el = document.getElementById('page-bg')
    if (!el) return
    if (url) {
      el.style.backgroundImage = `url('${url}')`
      el.style.display = 'block'
    } else {
      el.style.display = 'none'
      el.style.backgroundImage = ''
    }
  }

  // MUSIC
  let musicPlaying = false
  let currentMusicTitle = ''

  function extractYouTubeId(url) {
    if (!url) return null
    const match = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/)
    return match ? match[1] : null
  }

  function playMusic(youtubeUrl, title) {
    const videoId = extractYouTubeId(youtubeUrl)
    if (!videoId) return
    const iframe = document.getElementById('yt-player')
    const player = document.getElementById('music-player')
    const titleEl = document.getElementById('music-title')
    if (!iframe || !player) return
    iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&loop=1&playlist=${videoId}`
    player.style.display = 'flex'
    titleEl.textContent = title || 'Now playing'
    currentMusicTitle = title || 'Now playing'
    musicPlaying = true
    document.getElementById('music-toggle').textContent = '⏸️'
  }

  function toggleMusic() {
    const iframe = document.getElementById('yt-player')
    if (!iframe) return
    if (musicPlaying) {
      iframe.src = iframe.src.replace('autoplay=1', 'autoplay=0')
      document.getElementById('music-toggle').textContent = '▶️'
      musicPlaying = false
    } else {
      iframe.src = iframe.src.replace('autoplay=0', 'autoplay=1')
      document.getElementById('music-toggle').textContent = '⏸️'
      musicPlaying = true
    }
  }

  function stopMusic() {
    const iframe = document.getElementById('yt-player')
    const player = document.getElementById('music-player')
    if (iframe) iframe.src = ''
    if (player) player.style.display = 'none'
    musicPlaying = false
  }

  db.auth.onAuthStateChange((event, session) => { currentUser = session?.user ?? null; updateNav() })
  init()
</script>
</body>
</html>
